name: gmail_summary
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  googleapis: ^15.0.0
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  country_picker: ^2.0.27
  http: ^1.6.0
  share_plus: ^12.0.1
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  video_player: ^2.8.1
  flutter_markdown: ^0.7.5+1
  flutter_widget_from_html: ^0.17.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/videos/Catchy.mp4
    - assets/images/app_logo.png